# Local development only. All balances represent simulated money.
name: transfer-engine

services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-transfer}:${POSTGRES_PASSWORD:-transfer_dev}@postgres:5432/${POSTGRES_DB:-transfer_engine}?sslmode=disable"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-0}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5s}"
      HEALTH_TIMEOUT: "${HEALTH_TIMEOUT:-2s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-10s}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-15s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      HTTP_BODY_LIMIT_BYTES: "${HTTP_BODY_LIMIT_BYTES:-1048576}"
      TEST_FUNDS_ENABLED: "${TEST_FUNDS_ENABLED:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RECONCILIATION_ENABLED: "${RECONCILIATION_ENABLED:-false}"
      REDIS_ADDR: "redis:6379"
      MESSAGING_ENABLED: "${MESSAGING_ENABLED:-false}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-transfer}:${RABBITMQ_PASSWORD:-transfer_dev}@rabbitmq:5672/"
      MESSAGE_WORKERS: "${MESSAGE_WORKERS:-4}"
      MESSAGE_PREFETCH: "${MESSAGE_PREFETCH:-1}"
      DLQ_REPLAY_ENABLED: "${DLQ_REPLAY_ENABLED:-false}"
      FINANCIAL_API_ENABLED: "${FINANCIAL_API_ENABLED:-false}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"
      TELEMETRY_OTLP_ENDPOINT: "${TELEMETRY_OTLP_ENDPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-transfer_engine}"
      POSTGRES_USER: "${POSTGRES_USER:-transfer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-transfer_dev}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL runs this bootstrap only when its data volume is empty.
      # Existing databases require explicitly applying subsequent migrations.
      - ../migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
      - ../migrations/000002_reconciliation.up.sql:/docker-entrypoint-initdb.d/000002_reconciliation.sql:ro
      - ../migrations/000003_messaging.up.sql:/docker-entrypoint-initdb.d/000003_messaging.sql:ro
    healthcheck:
      # TCP stays unavailable while initdb executes the bootstrap SQL.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 15s

  # Auxiliary services are provisioned for phases 3 and 4. API readiness only
  # depends on PostgreSQL; Redis and RabbitMQ cannot govern money correctness.
  redis:
    image: redis:8.10.2-alpine3.23
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-transfer}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-transfer_dev}"
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
